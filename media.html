    <h1>Graphics and Media</h1>

    <!-- 1. Canvas Flag -->
    <h2>1. Flag on Canvas</h2>
    <canvas id="flagCanvas" width="300" height="180" style="border: 1px solid black;">
        Canvas not supported.
    </canvas>

    <script>
        const c = document.getElementById("flagCanvas");
        const ctx = c.getContext("2d");

        // Green Rectangle
        ctx.fillStyle = "green";
        ctx.fillRect(40, 20, 200, 110);

        // White Circle
        ctx.beginPath();
        ctx.arc(140, 75, 25, 0, 2 * Math.PI);
        ctx.fillStyle = "white";
        ctx.fill();

        // Flag Pole Line
        ctx.beginPath();
        ctx.moveTo(40, 10);
        ctx.lineTo(40, 160);
        ctx.stroke();

        // Text
        ctx.font = "16px Arial";
        ctx.fillStyle = "black";
        ctx.fillText("My Flag", 110, 160);
    </script>

    <!-- 2. SVG Shapes (4+ shapes) -->
    <h2>2. House on SVG</h2>
    <svg width="300" height="180" style="border: 1px solid black;">
        <polygon points="100,20 40,70 160,70" fill="red" />
        <rect x="60" y="70" width="80" height="70" fill="yellow" stroke="black" />
        <circle cx="230" cy="40" r="20" fill="orange" />
        <line x1="10" y1="140" x2="290" y2="140" stroke="green" stroke-width="3" />
        <text x="70" y="165" fill="blue">Sodais House</text>
    </svg>
